plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
    id 'kotlin-parcelize'

}

android {
    compileSdk 32

    defaultConfig {
        applicationId "com.akhnaton.foodvisits"
        minSdk 21
        targetSdk 32
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        dataBinding true
    }
    kapt {
        correctErrorTypes = true
    }
    namespace 'com.akhnaton.foodvisits'
}

dependencies {

    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.5.0'
    implementation 'com.google.firebase:firebase-firestore-ktx:24.1.2'
    implementation 'com.google.firebase:firebase-appcheck-safetynet:16.0.0'
    implementation 'com.google.firebase:firebase-storage-ktx:20.0.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation "androidx.activity:activity-ktx:1.5.0"
    implementation "androidx.fragment:fragment-ktx:1.5.0"

    //Fragment Navigation
    def nav_version = "2.5.0"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    //Sdp & Ssp
    implementation 'com.intuit.sdp:sdp-android:1.0.6'
    implementation 'com.intuit.ssp:ssp-android:1.0.6'

    //Lotti Animation
    implementation "com.airbnb.android:lottie:3.4.0"

    //ViewModel and livedata
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.0'

    //Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava3:2.9.0'
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.3.1"

    //OkHttp
    def OkHttp_version = '4.9.3'
    implementation "com.squareup.okhttp3:okhttp:$OkHttp_version"
    implementation "com.squareup.okhttp3:logging-interceptor:$OkHttp_version"

    //Show Image
    implementation 'com.github.bumptech.glide:glide:4.13.0'
//    annotationProcessor 'com.github.bumptech.glide:compiler:4.13.0'
    kapt 'com.github.bumptech.glide:compiler:4.13.0'

//    implementation("com.github.bumptech.glide:okhttp3-integration:4.2.0") {
//        exclude group: 'glide-parent'
//    }

    // Circle Image
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    // Circle Progress
    implementation 'com.github.bmarrdev:android-DecoView-charting:v1.2'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Room Database
    def room_version = "2.4.0"
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    // optional - Kotlin Extensions and Coroutines support for Room
    implementation "androidx.room:room-ktx:$room_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"

    //Coroutines
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.1")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.1")

    //Firebase
    implementation 'com.google.firebase:firebase-messaging-ktx:23.0.8'
    // Import the BoM for the Firebase platform
    implementation platform('com.google.firebase:firebase-bom:30.3.1')

    // Declare the dependency for the App Check library
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'

    //Progress Dialog
    implementation 'com.github.welcome2c:LottieProgressDialog:1.0.1'

    //Print Invoice
    implementation "com.github.AhmedElsayed94:SunmiPrinterSdk:1.0.0"

    //Search In spinner
    implementation 'com.github.jrizani:JRSpinner:1.1.2'

    //Get Location
    //Google play services - vision
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    //google maps utils, gms location
    implementation 'com.google.maps.android:android-maps-utils:0.5'

    implementation 'com.google.android.gms:play-services-maps:18.1.0'
    implementation 'com.google.android.gms:play-services-location:17.1.0'
//    implementation 'com.google.android.gms:play-services-location:20.0.0'

    implementation 'com.github.f0ris.sweetalert:library:1.5.1'

    //Crop
//    implementation 'id.zelory:compressor:2.1.0'
    implementation 'com.github.CanHub:Android-Image-Cropper:3.2.1'
    //Pick Image From Camera And Gallery
    implementation 'com.github.dhaval2404:imagepicker:2.1'

    //quantity view
    implementation 'me.himanshusoni.quantityview:quantity-view:1.2.0'

    //gson
    implementation 'com.google.code.gson:gson:2.10.1'

    //Event bus
    implementation("org.greenrobot:eventbus:3.3.1")
}